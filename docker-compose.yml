services:
  mysql:
    image: mysql:8.4
    container_name: autotradebtc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autotradebtc
    ports:
      - "3306:3306"
    volumes:
      - autotradebtc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autotradebtc-mysql-data:
