spring.application.name=autotradebtc

# MySQL datasource - update credentials/host to match your local setup.
# createDatabaseIfNotExist=true will create the schema on first connection.
spring.datasource.url=jdbc:mysql://localhost:3306/autotradebtc?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Spring Boot defaults @Scheduled tasks to a single shared thread. This app now has 5 of them
# (wallet sync, wallet position feed, whale wallet scan, whale order scan, whale order cleanup) -
# on one thread, a slow run of any of them (e.g. the whale wallet scan, which rate-limits itself
# to Hyperliquid at ~1.5s/call per candidate) starves every other scheduled job behind it. One
# thread per job avoids that.
spring.task.scheduling.pool.size=5

# Bitcoin blockchain explorer used to fetch wallet transactions (public API, no key required)
app.blockchain.explorer.base-url=https://blockstream.info/api

# Hyperliquid public info API used to fetch trading activity for Hyperliquid wallets (no key required)
app.hyperliquid.api.base-url=https://api.hyperliquid.xyz

# Hyperliquid's public (undocumented) stats/leaderboard API - used to discover whale wallets.
# This is the same API their own web UI calls; it isn't an official contract and could change.
app.hyperliquid.stats-api.base-url=https://stats-data.hyperliquid.xyz

# Hyperliquid's public WebSocket API - used for the real-time BTC futures trade feed (market-wide:
# every trade by every trader on the BTC perp, not just tracked wallets).
app.hyperliquid.ws-url=wss://api.hyperliquid.xyz/ws

# Exchange BTC/USDT spot order-book depth APIs polled for whale limit-order tracking (large
# resting order detection, Coinglass "large orderbook statistics" style) - all public, no key
# required. Spot books are used (rather than futures) so order size is directly in BTC, with no
# per-exchange contract-multiplier conversion needed.
app.exchange.binance.api.base-url=https://api.binance.com
# my.okx.com serves the identical public OKX API as www.okx.com, but www.okx.com's direct
# (non-Cloudflare) IP was found unreachable from this network (connection timeout on every
# request) while my.okx.com's Cloudflare-fronted IP responds normally - use it instead.
app.exchange.okx.api.base-url=https://my.okx.com
app.exchange.bybit.api.base-url=https://api.bybit.com

# Whale limit-order tracking: a resting price level becomes a tracked "whale order" once its
# notional value (price * size) reaches this; it's only marked REMOVED once it falls under half
# that, to stop a level sitting right at the threshold from flapping ACTIVE/REMOVED every scan.
# Hyperliquid's already-live order book (HyperliquidOrderBookStreamClient) is reused as a fourth
# source alongside the three polled exchanges above, at no extra polling cost.
app.whale.order.min-notional-usd=1000000
app.whale.order.scan-interval-ms=15000
app.whale.order.retention-days=30

# Whale discovery scan: runs on a timer, looking for wallets with account value at/above
# min-account-value, positive PnL in both the "month" and "allTime" leaderboard windows
# (closest available proxy for "consistently profitable"), and max open-position leverage
# below max-leverage. Matches are auto-saved as tracked wallets.
app.whale.scan-interval-ms=180000
app.whale.min-account-value=100000
app.whale.max-leverage=10

# "Scan & mark" button on the wallets screen: checks every tracked Hyperliquid wallet against a
# fresh leaderboard snapshot and marks any whose all-time PnL exceeds this, replacing the manual
# workflow of opening each wallet's Coinglass page and marking the large ones by hand.
app.whale.auto-mark-min-total-pnl=10000000

# Wallet BTC data sync: each run refreshes open BTC orders/position and realized/unrealized BTC
# PnL for the next sync-batch-size Hyperliquid wallets (oldest-attempted first, round-robin), so
# every tracked wallet eventually gets synced no matter how many there are, without ever flooding
# Hyperliquid's rate limit in one run. Each wallet costs 3 throttled API calls (~1.5s apart), so a
# batch of 10 takes well under a minute - comfortably inside even this 2-minute interval.
app.wallet.sync-interval-ms=120000
app.wallet.sync-batch-size=10

# How often the live position feed (WalletPositionStreamService) reconciles its WebSocket
# subscriptions against the currently marked Hyperliquid wallets - i.e. how quickly marking or
# unmarking a wallet takes effect on the live feed.
app.wallet.position-stream-refresh-ms=30000
